[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "E501",
  "F", "W", "I", "B", "BLE", "UP", "SIM", "RUF",
  "S110", "S113", "PLW1510", "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
# qutebrowser injects these names when loading config.py.
"dotfiles/.config/qutebrowser/config.py" = ["F821"]
# GI imports are selected dynamically and must follow gi.require_version().
"dotfiles/.local/bin/livestream-config" = ["E402"]
"dotfiles/.local/bin/livestream-service" = ["E402"]
"dotfiles/.local/bin/screenrecord-overlay-title-edit" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
