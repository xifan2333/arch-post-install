min_version = "2026.9.4"

[tools]
hk = "latest"
lua = "latest"
oxlint = "latest"
prettier = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
taplo = "latest"

[tasks.hooks]
description = "Install or refresh hk Git hooks"
run = "hk install"

[tasks.check]
description = "Run hk check across modified or staged files"
run = "hk check"

[tasks."check:plan"]
description = "Preview hk check execution plan without running tools"
run = "hk run check --plan"

[tasks."check:changed"]
description = "Run hk check only on modified/staged/untracked files"
run = """
#!/usr/bin/env bash
set -euo pipefail
{
  git diff --name-only -z
  git diff --cached --name-only -z
  git ls-files --others --exclude-standard -z
} | hk run check --files0-from - "$@"
"""

[tasks.fix]
description = "Run all hk fixers to format files"
run = "hk fix"

[tasks.lint]
description = "Run full static analysis and syntax checks across the repository"
run = "hk check --all"

[tasks.format]
description = "Format all Python, Shell, Lua, TOML, and JSON/YAML files across the repository"
run = "hk fix --all"

[tasks."vm:start"]
description = "Start the arch-basic testing VM (pass --headless for no GUI)"
run = "./vms/arch-basic/vm.sh start \"$@\""

[tasks."vm:stop"]
description = "Gracefully stop the arch-basic testing VM"
run = "./vms/arch-basic/vm.sh stop"

[tasks."vm:ssh"]
description = "SSH into the arch-basic testing VM (user: arch, port: 22220)"
run = "./vms/arch-basic/vm.sh ssh \"$@\""

[tasks."vm:status"]
description = "Show arch-basic VM running status, disk usage, and snapshots"
run = "./vms/arch-basic/vm.sh status"

[tasks."vm:reset"]
description = "Stop arch-basic VM and revert disk to clean-systemd-boot snapshot"
run = "./vms/arch-basic/vm.sh reset"
