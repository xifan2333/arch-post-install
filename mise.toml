min_version = "2026.9.4"

[tools]
hk = "2"
jq = "latest"
prettier = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
taplo = "latest"

[tasks.hooks]
description = "Install or refresh hk Git hooks"
run = "hk install"

[tasks.check]
description = "Check staged, unstaged, and untracked files with hk"
alias = "check:changed"
run = "hk check --check"

[tasks."check:plan"]
description = "Preview hk check execution plan without running tools"
run = "hk check --check --plan"

[tasks.fix]
description = "Run all hk fixers to format files"
run = "hk fix"

[tasks.lint]
description = "Run full static analysis and syntax checks across the repository"
run = "hk check --check --all"

[tasks.format]
description = "Format all Python, Shell, Lua, TOML, and JSON/YAML files across the repository"
run = "hk fix --all"
