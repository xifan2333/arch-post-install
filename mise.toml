min_version = "2026.8.2"

[tools]
lefthook = "latest"
lua = "latest"
prettier = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
taplo = "latest"

[settings]
dotfiles.default_mode = "symlink"

# Provides /usr/lib/ladspa/librnnoise_ladspa.so, which is loaded by the
# PipeWire noise-canceling source configuration.
[bootstrap.packages]
"pacman:noise-suppression-for-voice" = "latest"
"pacman:ttf-sarasa-gothic" = "latest"
"pacman:unzip" = "latest"
"pacman:yay" = "latest"
# Official extra/wezterm (2024-02) fails to map windows on Hyprland 0.56 Wayland;
# archlinuxcn ships a current enough build. Conflicts with pacman:wezterm.
"pacman:wezterm-git" = "latest"
# VAAPI 硬编驱动——仅本机（Intel Sandy Bridge i965）需要；其他硬件请按需取消注释
# "pacman:libva-intel-driver" = "latest"
# "pacman:libva-utils" = "latest"

# Pacman hooks that re-apply Wayland IME flags to the QQ/WeChat desktop
# entries. They live under /etc and need root, so they are declarative
# bootstrap files instead of a shell task: mise converges content/owner/mode
# and surfaces them in `mise bootstrap status` / `--dry-run` / `plan`.
[bootstrap.directories."/etc/pacman.d/hooks"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/pacman.d/hooks/linuxqq-appimage-ime.hook"]
source = "./mise/hooks/linuxqq-appimage-ime.hook"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/pacman.d/hooks/wechat-appimage-ime.hook"]
source = "./mise/hooks/wechat-appimage-ime.hook"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/pacman.d/hooks/wps-office-ime.hook"]
source = "./mise/hooks/wps-office-ime.hook"
owner = "root"
group = "root"
mode = "0644"

# Rebuild and reload Rime deployment when rime-wanxiang packages are updated.
[bootstrap.files."/etc/pacman.d/hooks/rime-wanxiang-deploy.hook"]
source = "./mise/hooks/rime-wanxiang-deploy.hook"
owner = "root"
group = "root"
mode = "0644"

# Preserve per-file linking without scanning all of $HOME:
# shared directories are recreated and each managed file is linked
# individually, while files not owned by this repository remain untouched.
[dotfiles]
"~/.zshrc" = { source = "dotfiles/.zshrc" }
"~/.tmux.conf" = { source = "dotfiles/.tmux.conf" }
"~/.config/electron-flags.conf" = { source = "dotfiles/.config/electron-flags.conf" }
"~/.config/mimeapps.list" = { source = "dotfiles/.config/mimeapps.list" }
"~/.config/starship.toml" = { source = "dotfiles/.config/starship.toml" }
"~/.config/xdg-terminals.list" = { source = "dotfiles/.config/xdg-terminals.list" }

"~/.config/environment.d" = { source = "dotfiles/.config/environment.d", mode = "symlink-each" }
"~/.config/fcitx5" = { source = "dotfiles/.config/fcitx5", mode = "symlink-each" }
"~/.config/fontconfig" = { source = "dotfiles/.config/fontconfig", mode = "symlink-each" }
"~/.config/git" = { source = "dotfiles/.config/git", mode = "symlink-each" }
"~/.config/herdr" = { source = "dotfiles/.config/herdr", mode = "symlink-each" }
"~/.config/hypr" = { source = "dotfiles/.config/hypr", mode = "symlink-each" }
"~/.config/mise" = { source = "dotfiles/.config/mise", mode = "symlink-each" }
"~/.config/wezterm" = { source = "dotfiles/.config/wezterm", mode = "symlink-each" }
"~/.config/nvim" = { source = "dotfiles/.config/nvim", mode = "symlink-each" }
"~/.config/omarchy" = { source = "dotfiles/.config/omarchy", mode = "symlink-each" }
"~/.config/pipewire" = { source = "dotfiles/.config/pipewire", mode = "symlink-each" }
"~/.config/qutebrowser" = { source = "dotfiles/.config/qutebrowser", mode = "symlink-each", exclude = [
  "*.example",
] }
"~/.config/retroarch" = { source = "dotfiles/.config/retroarch", mode = "symlink-each" }
"~/.config/systemd" = { source = "dotfiles/.config/systemd", mode = "symlink-each" }
"~/.config/tensaku" = { source = "dotfiles/.config/tensaku", mode = "symlink-each" }
"~/.config/uv" = { source = "dotfiles/.config/uv", mode = "symlink-each" }
"~/.config/waybar" = { source = "dotfiles/.config/waybar", mode = "symlink-each" }
"~/.config/zsh" = { source = "dotfiles/.config/zsh", mode = "symlink-each" }

"~/.local/bin" = { source = "dotfiles/.local/bin", mode = "symlink-each" }
"~/.local/share/applications" = { source = "dotfiles/.local/share/applications", mode = "symlink-each" }
"~/.local/share/fcitx5" = { source = "dotfiles/.local/share/fcitx5", mode = "symlink-each" }
"~/.local/share/qutebrowser" = { source = "dotfiles/.local/share/qutebrowser", mode = "symlink-each" }

[tasks.lint]
description = "Lint and syntax-check every tracked language"
run = "scripts/lint"

[tasks.hooks]
description = "Install or refresh lefthook git hooks"
run = "lefthook install"

[tasks.format]
description = "Format tracked Python, Bash, Lua, TOML, JSON, and YAML files"
run = "scripts/format"

# Imperative leftovers that are not static dotfiles. This task runs after
# tools are installed, so every operation here must remain idempotent.
[tasks.aur]
description = "Install required AUR applications"
run = '''
#!/usr/bin/env bash
set -euo pipefail

packages=(
  dmnotifier-bin
  fcitx5-vinput-bin
  flac1.3
  herdr-corral-bin
  karing-bin
  linuxqq-appimage
  listen1
  ttf-wps-fonts
  unibarrage-bin
  wechat-appimage
  wps-office-365-edu
  wps-office-365-edu-fonts
)
missing=()

for package in "${packages[@]}"; do
  pacman -Q "$package" &>/dev/null || missing+=("$package")
done

if [[ -z "${missing[*]-}" ]]; then
  printf 'AUR applications are already installed\n'
  exit 0
fi

if ! command -v yay &>/dev/null; then
  printf 'yay is required to install: %s\n' "${missing[*]}" >&2
  exit 1
fi

yay -S --needed --noconfirm "${missing[@]}"
'''

[tasks.bootstrap]
description = "Apply post-bootstrap setup"
depends = ["aur", "wps"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

config_home="${XDG_CONFIG_HOME:-$HOME/.config}"
theme="$config_home/omarchy/current/theme/neovim.lua"
target="$config_home/nvim/lua/plugins/theme.lua"

if [[ -f "$theme" ]]; then
  mkdir -p "$(dirname "$target")"
  if [[ -L "$target" ]]; then
    ln -sfn "$theme" "$target"
  elif [[ ! -e "$target" ]]; then
    ln -s "$theme" "$target"
  else
    printf 'bootstrap: preserving unmanaged file: %s\n' "$target" >&2
  fi
fi

# Omarchy migrations may replace Waybar's main config. Restore the regular
# include wrapper from its user-owned template after dotfiles are applied.
waybar_hook="$config_home/omarchy/hooks/post-update.d/waybar-capture.hook"
if [[ -f "$waybar_hook" ]]; then
  bash "$waybar_hook"
fi
'''

[tasks.fonts]
description = "Install latest pixel fonts for pi-undefined-video"
run = '''
#!/usr/bin/env bash
set -euo pipefail

for command in gh unzip fc-cache; do
  if ! command -v "$command" &>/dev/null; then
    printf '%s is required to install pixel fonts\n' "$command" >&2
    exit 1
  fi
done

dest="${XDG_DATA_HOME:-$HOME/.local/share}/fonts"
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
mkdir -p "$dest" "$tmp/fusion" "$tmp/uranus" "$tmp/boutique"

# Download the latest stable releases rather than pinning release tags.
gh release download --repo TakWolf/fusion-pixel-font \
  --pattern 'fusion-pixel-font-12px-monospaced-ttf-v*.zip' \
  --dir "$tmp/fusion"
rm -f "$dest"/fusion-pixel-12px-monospaced-*.ttf
unzip -oj "$tmp/fusion"/*.zip -d "$dest" >/dev/null
printf 'Fusion Pixel 12px updated\n'

gh release download --repo scott0107000/Uranus-Pixel \
  --pattern 'Uranus_Pixel.zip' \
  --dir "$tmp/uranus"
rm -f "$dest"/Uranus_Pixel*.ttf
unzip -oj "$tmp/uranus"/*.zip -d "$dest" >/dev/null
printf 'Uranus Pixel 11Px updated\n'

gh release download --repo scott0107000/BoutiqueBitmap7x7 \
  --pattern 'BoutiqueBitmap7x7_[0-9]*.ttf' \
  --dir "$tmp/boutique"
rm -f "$dest"/BoutiqueBitmap7x7_*.ttf
install -m 0644 "$tmp/boutique"/BoutiqueBitmap7x7_*.ttf "$dest/"
printf 'BoutiqueBitmap7x7 updated\n'

fc-cache -f "$dest"
printf 'Pixel fonts setup complete.\n'
'''

[tasks.wps]
description = "Ensure WPS uses multi-component mode"
run = '''
#!/usr/bin/env bash
set -euo pipefail

cfg="${XDG_CONFIG_HOME:-$HOME/.config}/Kingsoft/Office.conf"
mkdir -p "$(dirname "$cfg")"
touch "$cfg"

keys=(
  'wpsoffice\Application%20Settings\AppComponentMode'
  'wpsoffice\Application%20Settings\AppComponentModeInstall'
)

for key in "${keys[@]}"; do
  if grep -qF "${key}=" "$cfg"; then
    sed -i "s|^${key}=.*|${key}=prome_independ|" "$cfg"
    printf '[updated] %s=prome_independ\n' "$key"
  else
    printf '%s=prome_independ\n' "$key" >> "$cfg"
    printf '[added] %s=prome_independ\n' "$key"
  fi
done
'''
