[bootstrap.packages]
# Base & Dev Tools
"pacman:android-tools" = "latest"
"pacman:android-udev" = "latest"
"pacman:git" = "latest"
"pacman:unzip" = "latest"
"pacman:yay" = "latest"

# IME (Fcitx5 + Rime Xiaohe Double Pinyin)
"pacman:fcitx5-configtool" = "latest"
"pacman:fcitx5-rime" = "latest"
"pacman:rime-wanxiang-flypy" = "latest"
"aur:fcitx5-vinput-bin" = "latest"

# Fonts
"pacman:ttf-sarasa-gothic" = "latest"
"aur:ttf-wps-fonts" = "latest"
"aur:wps-office-365-edu-fonts" = "latest"

# Terminal
# Official extra/wezterm fails to map windows on recent Wayland;
# archlinuxcn ships a current enough build. Conflicts with pacman:wezterm.
"pacman:wezterm-git" = "latest"

# Audio & Voice
# Provides /usr/lib/ladspa/librnnoise_ladspa.so for PipeWire noise-canceling
"pacman:noise-suppression-for-voice" = "latest"
"aur:flac1.3" = "latest"

# Applications (AUR)
"aur:dmnotifier-bin" = "latest"
"aur:herdr-corral-bin" = "latest"
"aur:karing-bin" = "latest"
"aur:linuxqq-appimage" = "latest"
"aur:unibarrage-bin" = "latest"
"aur:wechat-appimage" = "latest"
"aur:wps-office-365-edu" = "latest"
