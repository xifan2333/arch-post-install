# System initialization hook: runs before package manager installation
[bootstrap.hooks.pre-packages]
run = "mise/hooks/pre-packages.sh"

# Post-dotfiles hook: seed runtime configuration templates and sync themes
[bootstrap.hooks.post-dotfiles]
run = "mise/hooks/post-dotfiles.sh"

# Default login shell for the user
[bootstrap.user]
login_shell = "/usr/bin/zsh"

# Declarative Linux systemd system services
[bootstrap.services.iwd]
state = "running"
enabled = true

[bootstrap.services.bluetooth]
state = "running"
enabled = true

[bootstrap.services.systemd-timesyncd]
state = "running"
enabled = true

[bootstrap.services.thermald]
state = "running"
enabled = true

[bootstrap.services.power-profiles-daemon]
state = "running"
enabled = true

# Pure suckless network stack: systemd-networkd for wired, iwd for Wi-Fi
[bootstrap.services.systemd-networkd]
state = "running"
enabled = true

# Mask wait-online service to avoid 2-minute boot timeouts when offline
[bootstrap.services.systemd-networkd-wait-online]
state = "stopped"
enabled = false

# Direct seamless auto-login service to River with xrwm (bypassing DM and Shell)
[bootstrap.files."/etc/systemd/system/arch-seamless-login.service"]
source = "../systemd/system/arch-seamless-login.service"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.services.arch-seamless-login]
state = "running"
enabled = true

# Disable conflicting getty on tty1
[bootstrap.services."getty@tty1"]
state = "stopped"
enabled = false

# Configure iwd with built-in lightweight network/DHCP configuration
[bootstrap.directories."/etc/iwd"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/iwd/main.conf"]
source = "../iwd/main.conf"
owner = "root"
group = "root"
mode = "0644"

# Configure systemd-networkd for wired interfaces while delegating Wi-Fi to iwd
[bootstrap.directories."/etc/systemd/network"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/systemd/network/20-wired.network"]
source = "../systemd/network/20-wired.network"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/systemd/network/80-wifi.network"]
source = "../systemd/network/80-wifi.network"
owner = "root"
group = "root"
mode = "0644"

# Rebuild and reload Rime deployment when rime-wanxiang packages are updated.
[bootstrap.directories."/etc/pacman.d/hooks"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/pacman.d/hooks/rime-wanxiang-deploy.hook"]
source = "../hooks/rime-wanxiang-deploy.hook"
owner = "root"
group = "root"
mode = "0644"

# Enable manual hardware fan control on ThinkPad (/proc/acpi/ibm/fan)
[bootstrap.files."/etc/modprobe.d/thinkpad_acpi.conf"]
source = "../modprobe.d/thinkpad_acpi.conf"
owner = "root"
group = "root"
mode = "0644"

# Grant non-root write access to /proc/acpi/ibm/fan for instant UI control
[bootstrap.files."/etc/tmpfiles.d/thinkpad-fan.conf"]
source = "../tmpfiles.d/thinkpad-fan.conf"
owner = "root"
group = "root"
mode = "0644"

# Grant non-root write access to Intel GPU frequency nodes
[bootstrap.files."/etc/tmpfiles.d/intel-gpu.conf"]
source = "../tmpfiles.d/intel-gpu.conf"
owner = "root"
group = "root"
mode = "0644"

# Declarative Plymouth boot splash theme
[bootstrap.directories."/usr/share/plymouth/themes/arch"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/usr/share/plymouth/themes/arch/arch.plymouth"]
source = "../plymouth/themes/arch/arch.plymouth"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/usr/share/plymouth/themes/arch/arch.script"]
source = "../plymouth/themes/arch/arch.script"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/plymouth/plymouthd.conf"]
source = "../plymouth/plymouthd.conf"
owner = "root"
group = "root"
mode = "0644"

# Early initramfs Plymouth splash hook to eliminate boot log text
[bootstrap.directories."/etc/mkinitcpio.conf.d"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/mkinitcpio.conf.d/plymouth.conf"]
source = "../mkinitcpio.conf.d/plymouth.conf"
owner = "root"
group = "root"
mode = "0644"
