# System initialization hook: runs before package manager installation
[bootstrap.hooks.pre-packages]
run = "mise/hooks/pre-packages.sh"

# Post-dotfiles hook: seed runtime configuration templates and sync themes
[bootstrap.hooks.post-dotfiles]
run = "mise/hooks/post-dotfiles.sh"

# Default login shell for the user
[bootstrap.user]
login_shell = "/usr/bin/zsh"

# Declarative Linux systemd system services
[bootstrap.services.NetworkManager]
state = "running"
enabled = true

[bootstrap.services.bluetooth]
state = "running"
enabled = true

[bootstrap.services.systemd-timesyncd]
state = "running"
enabled = true

[bootstrap.services.thermald]
state = "running"
enabled = true

[bootstrap.services.power-profiles-daemon]
state = "running"
enabled = true

# Retire SDDM display manager in favor of direct tty1 autologin to River
[bootstrap.services.sddm]
state = "stopped"
enabled = false

# Autologin on tty1 for direct graphical session bootstrap
[bootstrap.directories."/etc/systemd/system/getty@tty1.service.d"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/systemd/system/getty@tty1.service.d/autologin.conf"]
source = "../systemd/system/getty@tty1.service.d/autologin.conf"
owner = "root"
group = "root"
mode = "0644"

# Disable Wi-Fi power saving in NetworkManager to eliminate latency spikes
[bootstrap.directories."/etc/NetworkManager/conf.d"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/NetworkManager/conf.d/wifi-powersave.conf"]
source = "../NetworkManager/conf.d/wifi-powersave.conf"
owner = "root"
group = "root"
mode = "0644"

# Rebuild and reload Rime deployment when rime-wanxiang packages are updated.
[bootstrap.directories."/etc/pacman.d/hooks"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/pacman.d/hooks/rime-wanxiang-deploy.hook"]
source = "../hooks/rime-wanxiang-deploy.hook"
owner = "root"
group = "root"
mode = "0644"

# Enable manual hardware fan control on ThinkPad (/proc/acpi/ibm/fan)
[bootstrap.files."/etc/modprobe.d/thinkpad_acpi.conf"]
source = "../modprobe.d/thinkpad_acpi.conf"
owner = "root"
group = "root"
mode = "0644"

# Grant non-root write access to /proc/acpi/ibm/fan for instant UI control
[bootstrap.files."/etc/tmpfiles.d/thinkpad-fan.conf"]
source = "../tmpfiles.d/thinkpad-fan.conf"
owner = "root"
group = "root"
mode = "0644"

# Grant non-root write access to Intel GPU frequency nodes
[bootstrap.files."/etc/tmpfiles.d/intel-gpu.conf"]
source = "../tmpfiles.d/intel-gpu.conf"
owner = "root"
group = "root"
mode = "0644"

# Declarative Plymouth boot splash theme
[bootstrap.directories."/usr/share/plymouth/themes/arch"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/usr/share/plymouth/themes/arch/arch.plymouth"]
source = "../plymouth/themes/arch/arch.plymouth"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/usr/share/plymouth/themes/arch/arch.script"]
source = "../plymouth/themes/arch/arch.script"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/usr/share/plymouth/themes/arch/logo.png"]
source = "../plymouth/themes/arch/logo.png"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/usr/share/plymouth/themes/arch/entry.png"]
source = "../plymouth/themes/arch/entry.png"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/usr/share/plymouth/themes/arch/lock.png"]
source = "../plymouth/themes/arch/lock.png"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/usr/share/plymouth/themes/arch/bullet.png"]
source = "../plymouth/themes/arch/bullet.png"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/usr/share/plymouth/themes/arch/progress_box.png"]
source = "../plymouth/themes/arch/progress_box.png"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/usr/share/plymouth/themes/arch/progress_bar.png"]
source = "../plymouth/themes/arch/progress_bar.png"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/plymouth/plymouthd.conf"]
source = "../plymouth/plymouthd.conf"
owner = "root"
group = "root"
mode = "0644"
