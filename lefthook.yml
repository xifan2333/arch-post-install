# Lefthook git hooks. Install with `mise run hooks` (runs `lefthook install`).
#
# pre-commit automatically runs formatters (with stage_fixed to include fixes)
# and then runs static lint and syntax checks.
#
# Commit messages follow Conventional Commits via commitlint.

commit-msg:
  parallel: true
  commands:
    commitlint:
      run: commitlint --edit "$1"

pre-commit:
  commands:
    format:
      run: mise run format
      stage_fixed: true
    lint:
      run: mise run lint

pre-push:
  commands:
    lint:
      run: mise run lint
