# Walker autostart service is generated by systemd-xdg-autostart-generator
# from ~/.config/autostart/walker.desktop with a resolved /usr/bin/walker path,
# so the ~/.local/bin/walker wrapper never applies to it.
# Keep these env vars in sync with that wrapper.
[Service]
Environment=GTK_IM_MODULE=fcitx
Environment=GSK_RENDERER=cairo
