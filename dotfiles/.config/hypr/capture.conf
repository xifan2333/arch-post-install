# User-owned capture bindings. All mutations go through capture-router.

# Override Omarchy's default ALT+PRINT screenrecord menu binding.
unbind = ALT, PRINT
bindd = ALT, PRINT, Capture menu, exec, capture-router menu

# Move Omarchy's OCR shortcut from SUPER+CTRL+PRINT to CTRL+PRINT.
unbind = SUPER CTRL, PRINT
bindd = CTRL, PRINT, Extract text (OCR) from screenshot, exec, capture-text-extraction

# Recording/livestream domain (R = Record)
bindd = SUPER, R, Screenrecording toggle, exec, capture-router recording toggle --with-desktop-audio --with-microphone-audio
bindd = SUPER ALT, R, Live Stream, exec, capture-router livestream toggle portal
bindd = SUPER SHIFT, R, Live Stream config, exec, capture-router config

# Overlay toggles
bindd = SUPER ALT, V, Camera overlay toggle, exec, capture-router overlay camera
bindd = SUPER ALT, K, Keys overlay toggle, exec, capture-router overlay keys
bindd = SUPER ALT, C, Captions overlay toggle, exec, capture-router overlay captions
bindd = SUPER ALT, T, Title overlay toggle, exec, capture-router overlay title
bindd = SUPER SHIFT, T, Title overlay config, exec, capture-router overlay edit
