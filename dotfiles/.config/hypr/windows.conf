# Personal window rules (see omarchy defaults in
# ~/.local/share/omarchy/default/hypr/windows.conf + apps/*.conf)

# WezTerm is not in Omarchy's stock terminal tag list; opt into the same treatment.
windowrule = tag +terminal, match:class org.wezfurlong.wezterm
windowrule = tag -default-opacity, match:class org.wezfurlong.wezterm
windowrule = opacity 0.985 0.96, match:class org.wezfurlong.wezterm

# GTK config dialogs: float centered instead of tiling
windowrule = float on, match:class ^(screenrecord-overlay-title-edit)$
windowrule = center on, match:class ^(screenrecord-overlay-title-edit)$
