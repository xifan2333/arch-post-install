# SUPER + letter (core)
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, B, Browser, exec, omarchy-launch-browser
bindd = SUPER, E, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER, D, Docker, exec, omarchy-launch-tui lazydocker

# SUPER + ALT + letter (apps / variants)
bindd = SUPER ALT, RETURN, Herdr, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" herdr
bindd = SUPER ALT, E, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui musicfox
bindd = SUPER ALT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER ALT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime

# Screenrecording domain (G)
unbind = SUPER, G
unbind = SUPER ALT, G
bindd = SUPER, G, Screenrecording toggle, exec, omarchy-capture-screenrecording --stop-recording || omarchy-capture-screenrecording --with-desktop-audio --with-microphone-audio
bindd = SUPER ALT, G, Live Stream, exec, livestream-toggle
bindd = SUPER SHIFT, G, Live Stream config, exec, livestream-config

# Overlay toggles (xifan)
bindd = SUPER ALT, V, Camera overlay toggle, exec, screenrecord-overlay-camera-toggle
bindd = SUPER ALT, K, Keys overlay toggle, exec, screenrecord-overlay-keys-toggle
bindd = SUPER ALT, C, Captions overlay toggle, exec, screenrecord-overlay-captions-toggle
bindd = SUPER ALT, T, Title overlay toggle, exec, screenrecord-overlay-title-toggle
bindd = SUPER SHIFT, T, Title overlay config, exec, screenrecord-overlay-title-edit

# Reload config
bindd = SUPER, R, Reload Hyprland config, exec, hyprctl reload

# Monitor focus
bindd = SUPER, PERIOD, Focus next monitor, focusmonitor, +1
bindd = SUPER, COMMA, Focus previous monitor, focusmonitor, -1

# Fullscreen with F11 (note: intercepts app-level F11, e.g. browser fullscreen)
bindd = , F11, Full screen, fullscreen, 0

# Screenshots (old muscle memory, implemented via Omarchy commands)
bindd = SHIFT, PRINT, Screenshot fullscreen, exec, omarchy capture screenshot fullscreen
bindd = SUPER SHIFT, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

# One-key lock screen
bindd = SUPER SHIFT, ESCAPE, Lock screen, exec, omarchy system lock
