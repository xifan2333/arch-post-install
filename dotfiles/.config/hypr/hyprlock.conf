# ==============================================================================
# hyprlock — Minimalist Wayland screen locker with biometric support
# ==============================================================================
source = ~/.local/state/theme/hyprlock.conf

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    color = $bg
    blur_passes = 2
    blur_size = 6
}

# ---------------------------------------------------------------------------
# Biometric Authentication & Input Field
# ---------------------------------------------------------------------------

auth {
    fingerprint:enabled = true
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = $accent
    inner_color = $selection
    font_color = $fg

    fade_on_empty = false
    placeholder_text = <i>输入密码 / 验证指纹...</i>
    hide_input = false

    check_color = $accent
    fail_color = $red
    fail_text = <i>验证失败 ($ATTEMPTS)</i>

    font_family = Sarasa Mono SC
    rounding = 25
    position = 0, -40
    halign = center
    valign = center
}

# ---------------------------------------------------------------------------
# Dynamic Time & Date Labels
# ---------------------------------------------------------------------------

# Big Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $fg
    font_size = 72
    font_family = Sarasa Mono SC
    position = 0, 100
    halign = center
    valign = center
}

# Subtitle Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = $muted
    font_size = 15
    font_family = Sarasa Mono SC
    position = 0, 35
    halign = center
    valign = center
}

# Biometric / Unlock Prompt
label {
    monitor =
    text = 󰈚 扫描人脸 | 󰌾 触摸指纹传感器
    color = $muted
    font_size = 13
    font_family = Sarasa Mono SC
    position = 0, -110
    halign = center
    valign = center
}
