# ==============================================================================
# hyprlock — Minimalist Wayland screen locker and screensaver
# ==============================================================================
source = ~/.local/state/theme/hyprlock.conf

general {
    hide_cursor = false
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    color = $bg
    blur_passes = 3
    blur_size = 8
}

# ---------------------------------------------------------------------------
# Authentication & Input Field
# ---------------------------------------------------------------------------

auth {
    fingerprint:enabled = true
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = $accent
    inner_color = $selection
    font_color = $fg

    fade_on_empty = false
    placeholder_text =
    hide_input = false

    check_color = $accent
    fail_color = $red
    fail_text =

    font_family = monospace
    rounding = 24
    position = 0, -40
    halign = center
    valign = center
}

# ---------------------------------------------------------------------------
# Dynamic Time & Date Labels
# ---------------------------------------------------------------------------

# Big Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $fg
    font_size = 72
    font_family = monospace
    position = 0, 100
    halign = center
    valign = center
}

# Subtitle Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = $muted
    font_size = 15
    font_family = monospace
    position = 0, 35
    halign = center
    valign = center
}
