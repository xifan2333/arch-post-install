# -*- conf -*-
# Fnott notification daemon configuration
# Settings outside the theme managed block are preserved across theme switches.

# Global geometry and placement
layer=overlay
anchor=top-right
stacking-order=bottom-up
min-width=360
max-width=360
max-height=150
edge-margin-vertical=16
edge-margin-horizontal=16
notification-margin=6
border-size=2
border-radius=0
padding-vertical=10
padding-horizontal=12
max-icon-size=48
icon-theme=Adwaita

# Formatting (hide process/application name, keep clean summary & body)
title-format=
summary-format=<b>%s</b>\n
body-format=%b

# Timeout defaults (seconds)
default-timeout=6
idle-timeout=0
