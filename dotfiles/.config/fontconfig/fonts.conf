<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Universal Monospace Font: Sarasa Mono SC (CJK 1:2 ratio) -> NerdFont icons -> Noto fallbacks -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Sarasa Mono SC</string>
      <string>JetBrainsMono Nerd Font</string>
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>

  <!-- Universal Sans-Serif: Sarasa UI SC -> Noto Sans CJK SC -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Sarasa UI SC</string>
      <string>Sarasa Gothic SC</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <!-- Universal Serif: Noto Serif CJK SC -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
      <string>Liberation Serif</string>
    </edit>
  </match>

  <!-- Default Alias Preferences -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Sarasa Mono SC</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Sarasa UI SC</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Sarasa UI SC</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-monospace</family>
    <prefer>
      <family>Sarasa Mono SC</family>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
