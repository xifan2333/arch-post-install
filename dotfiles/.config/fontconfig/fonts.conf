<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 全局中文字体：更纱黑体（拉丁字体保持 Omarchy 默认，中文紧随其后） -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Liberation Sans</string>
      <string>Sarasa UI SC</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Liberation Serif</string>
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <!-- 等宽拉丁字体：omarchy-font-set 的 xmlstarlet 只会替换这个 match 块内的 string -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>
  <!-- 中文回退放在 alias/prefer：xmlstarlet 的 XPath 只命中上面的 match 块，
       这里不会被 omarchy font set 触碰 -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Sarasa Mono SC</family>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>
  <!-- 直接请求 JetBrainsMono Nerd Font 的程序（如 kitty）中文同样回退到 Sarasa -->
  <alias>
    <family>JetBrainsMono Nerd Font</family>
    <prefer>
      <family>Sarasa Mono SC</family>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>ui-monospace</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>
  <alias>
    <family>-apple-system</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <accept>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias>
    <family>serif</family>
    <accept>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias>
    <family>monospace</family>
    <accept>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
</fontconfig>
