[tools]
agy = "latest"
android-sdk = "latest"
aube = "latest"
bat = "latest"
btop = "latest"
claude = "latest"
codex = "latest"
delta = "latest"
entire = "latest"
eza = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
"github:Christ9038/Ydisks-Xianyu-Helper" = { version = "latest", postinstall = "bash ~/.config/xianyu/install-hook.sh" }
"github:go-musicfox/go-musicfox" = "latest"
"github:iOfficeAI/OfficeCLI" = "latest"
"github:zibo-chen/newbee-ocr-cli" = "latest"
go = "latest"
gradle = "latest"
herdr = "latest"
java = "latest"
jq = "latest"
just = "latest"
lazygit = "latest"
lefthook = "latest"
neovim = "latest"
node = "latest"
"npm:@jackwener/opencli" = "latest"
"npm:skills" = "latest"
pi = "latest"
"pipx:pioarduino" = "latest"
"pipx:yt-dlp" = { version = "latest", uvx_args = "--with secretstorage" }
ripgrep = "latest"
shfmt = "latest"
starship = "latest"
uv = "latest"
yazi = "latest"
yq = "latest"
zoxide = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]
minimum_release_age = "0s"
use_versions_host = false

[settings.github]
credential_command = "gh auth token"

[bootstrap.services.mise-history]
builtin = "history-watch"

[dotfiles]
"~/.zshrc" = { mode = "track" }
