[tools]
agy = "latest"
android-sdk = "latest"
aube = "latest"
claude = "latest"
codex = "latest"
entire = "latest"
gh = "latest"
"github:Christ9038/Ydisks-Xianyu-Helper" = { version = "latest", postinstall = "bash ~/.config/xianyu/install-hook.sh" }
"github:go-musicfox/go-musicfox" = "latest"
"github:iOfficeAI/OfficeCLI" = "latest"
"github:zibo-chen/newbee-ocr-cli" = "latest"
go = "latest"
gradle = "latest"
java = "latest"
just = "latest"
lefthook = "latest"
node = "latest"
"npm:@jackwener/opencli" = "latest"
"npm:skills" = "latest"
pi = "latest"
"pipx:pioarduino" = "latest"
"pipx:yt-dlp" = { version = "latest", uvx_args = "--with secretstorage" }
shfmt = "latest"
uv = "latest"
yq = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]
minimum_release_age = "0s"
use_versions_host = false

[settings.github]
credential_command = "gh auth token"
